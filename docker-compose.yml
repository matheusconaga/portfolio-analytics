services:
  postgres:
    image: postgres:17
    container_name: portfolio-analytics-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics_dev
      POSTGRES_DB: portfolio_analytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: